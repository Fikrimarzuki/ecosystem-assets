<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="780" height="380" viewBox="0 0 780 380" id="eye-component-test">
  <title>M1.1c disposable experiment: one Candidate-B-style eye (open and closed) as layered SVG</title>
  <desc>Feasibility test only. Not Mom artwork, not a production asset. Left: open eye. Right: closed (blink) frame on the same skin patch.</desc>
  <defs>
    <linearGradient id="skinPatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcdcc2"/>
      <stop offset="1" stop-color="#fbd2b4"/>
    </linearGradient>
    <radialGradient id="lidShade" cx="0.5" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#f1b796" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f1b796" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cbd0"/>
      <stop offset="0.35" stop-color="#f4eef0"/>
      <stop offset="1" stop-color="#fffbf8"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a200e"/>
      <stop offset="0.45" stop-color="#7c3a17"/>
      <stop offset="0.8" stop-color="#b56a2f"/>
      <stop offset="1" stop-color="#cf8b4a"/>
    </linearGradient>
    <radialGradient id="irisGlow" cx="0.5" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#e6a663" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e6a663" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a1d0d"/>
      <stop offset="0.6" stop-color="#3a160a"/>
      <stop offset="1" stop-color="#55250f"/>
    </linearGradient>
    <clipPath id="openingL"><path id="opening-shape" d="M 102 232 C 112 176 160 146 214 146 C 270 146 318 172 334 212 C 330 262 304 304 262 322 C 236 332 192 334 160 322 C 126 306 104 272 102 232 Z"/></clipPath>
  </defs>

  <g id="open-eye">
    <rect id="skin-patch-open" x="0" y="0" width="390" height="380" rx="18" fill="url(#skinPatch)"/>
    <ellipse id="lid-shade" cx="215" cy="150" rx="150" ry="70" fill="url(#lidShade)"/>
    <path id="brow" fill="#8e5034" opacity="0.92" d="M 58 58 C 100 20 172 8 238 16 C 288 22 322 34 342 50 C 316 46 282 42 242 42 C 178 40 114 50 66 72 C 58 72 54 66 58 58 Z"/>
    <path id="crease" fill="none" stroke="#c07a5e" stroke-width="3" stroke-linecap="round" d="M 104 132 C 140 106 200 98 252 104 C 284 108 308 120 320 134"/>
    <g id="eyeball" clip-path="url(#openingL)">
      <rect id="eye-white" x="90" y="140" width="260" height="200" fill="url(#white)"/>
      <ellipse id="iris" cx="212" cy="244" rx="80" ry="94" fill="url(#iris)"/>
      <ellipse id="iris-glow" cx="212" cy="290" rx="70" ry="46" fill="url(#irisGlow)"/>
      <ellipse id="iris-ring" cx="212" cy="244" rx="80" ry="94" fill="none" stroke="#3e1709" stroke-width="3"/>
      <ellipse id="pupil" cx="210" cy="250" rx="28" ry="38" fill="#2f1007"/>
      <path id="lid-shadow" fill="#3b1a10" opacity="0.28" d="M 90 140 L 350 140 L 350 196 C 300 170 160 168 90 214 Z"/>
    </g>
    <circle id="highlight" cx="170" cy="200" r="16" fill="#ffffff"/>
    <circle id="highlight-small" cx="250" cy="292" r="6" fill="#ffffff" opacity="0.75"/>
    <path id="upper-lash" fill="url(#lash)" d="M 96 246 C 92 196 128 152 186 142 C 246 132 304 150 336 186 C 340 174 342 164 342 154 C 348 164 352 176 352 190 C 358 184 364 180 370 178 C 366 190 358 200 348 206 C 354 210 358 216 360 222 C 350 220 342 218 336 214 C 312 182 266 162 212 162 C 156 162 116 194 104 246 Z"/>
    <path id="lower-lid" fill="none" stroke="#b46b52" stroke-width="2.6" stroke-linecap="round" opacity="0.7" d="M 190 334 C 230 336 270 324 300 300"/>
  </g>

  <g id="closed-eye" transform="translate(390 0)">
    <rect id="skin-patch-closed" x="0" y="0" width="390" height="380" rx="18" fill="url(#skinPatch)"/>
    <ellipse id="lid-shade-closed" cx="215" cy="180" rx="150" ry="80" fill="url(#lidShade)"/>
    <path id="brow-closed" fill="#8e5034" d="M 56 60 C 96 26 170 14 236 22 C 286 28 322 40 340 54 C 312 46 280 40 240 38 C 176 34 112 44 64 70 C 58 70 54 66 56 60 Z"/>
    <path id="closed-lid-fill" fill="#f6c6a6" opacity="0.6" d="M 104 230 C 140 196 284 196 336 222 C 300 250 150 254 104 230 Z"/>
    <path id="closed-lash" fill="url(#lash)" d="M 98 222 C 132 262 200 280 262 268 C 300 260 326 240 340 214 C 346 222 350 230 352 240 C 356 234 362 230 368 228 C 362 240 356 248 348 254 C 352 260 354 268 354 276 C 346 270 338 264 330 258 C 300 284 250 296 200 290 C 150 284 116 262 98 222 Z"/>
  </g>
</svg>
